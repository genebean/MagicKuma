name: Release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version: '1.27.4', cache: false }
      - name: Build release archives and checksums
        run: bash ci/binaries.sh "$GITHUB_REF_NAME" dist
      - name: Reserve a draft before publishing artifacts
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if ! gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          fi
      - name: Push multi-platform image
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME"
          docker buildx create --name magickuma-release --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image" .
      - name: Publish GitHub release assets
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
