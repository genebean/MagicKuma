name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version: stable, cache: false }
      - name: Formatting, module consistency and vet
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod tidy -diff
          go vet ./...
      - name: Scan repository history for secrets
        run: python3 ci/report.py secrets.xml --name repository-secrets -- bash ci/secrets.sh
      - if: always() && hashFiles('secrets.xml') != ''
        run: python3 ci/report.py secrets.xml --summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('secrets.xml') != ''
        with: { name: secret-scan-result, path: secrets.xml }
      - name: Check Go vulnerability reachability
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
      - name: Compile the supported binaries
        run: |
          for platform in linux/amd64 linux/arm64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${platform%/*}" GOARCH="${platform#*/}" go build -o "$RUNNER_TEMP/magickuma-${platform/\//-}" ./cmd/magickuma
          done

  unit:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version: stable, cache: false }
      - run: go install gotest.tools/gotestsum@v1.13.0
      - name: Unit, HTTPS and race tests
        run: gotestsum --junitfile unit.xml -- -race -coverprofile=coverage.out ./...
      - if: always() && hashFiles('unit.xml') != ''
        run: python3 ci/report.py unit.xml --summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-test-results
          path: |
            unit.xml
            coverage.out

  live:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version: stable, cache: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: AutoKuma 2.0.0 and Uptime Kuma 2.5.12
        run: python3 ci/report.py live.xml --name upstream-lifecycle -- bash ci/live.sh
      - if: always() && hashFiles('live.xml') != ''
        run: python3 ci/report.py live.xml --summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: live-test-results, path: live.xml }

  nixos:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Check flake outputs on all supported systems
        run: nix flake check --all-systems --no-build
      - name: Run NixOS VMs
        run: python3 ci/report.py nixos.xml --name nixos-publication -- nix build -L --no-link .#checks.x86_64-linux.publication
      - if: always() && hashFiles('nixos.xml') != ''
        run: python3 ci/report.py nixos.xml --summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: nixos-test-results, path: nixos.xml }

  image:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version: stable, cache: false }
      - name: Build and smoke-test non-root OCI image
        run: |
          docker build -t magickuma:test .
          docker run --rm magickuma:test version
          docker run --rm -v "$PWD/examples:/examples:ro" magickuma:test validate -manifest /examples/monitors.json
      - name: Scan the shipped Go executable
        run: |
          container=$(docker create magickuma:test)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/magickuma" "$RUNNER_TEMP/magickuma-image"
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck -mode=binary "$RUNNER_TEMP/magickuma-image"
